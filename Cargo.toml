[package]
name = "ocpop"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/kloki/ocpop"

[dependencies]
anyhow = "1"
braille-bar = "0.1.1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
